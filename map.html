<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Conflict Map</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #111; color: #eee; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

#toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 9px 14px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
  z-index: 1000; flex-shrink: 0;
}
#toolbar h1 { font-size: 13px; font-weight: 600; color: #bbb; letter-spacing: .06em; }
.tool {
  font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  background: #242424; color: #ccc; border: 1px solid #383838;
}
.tool:hover { background: #2e2e2e; }
.tool.active { background: #1d4ed8; border-color: #2563eb; color: #fff; }
#map.measuring { cursor: crosshair; }
#measure-readout {
  position: absolute; right: 12px; bottom: 12px; z-index: 900;
  background: #1b1b1b; border: 1px solid #3a3a3a; border-radius: 8px;
  padding: 9px 12px; font-size: 12px; color: #ddd; display: none;
  box-shadow: 0 6px 24px rgba(0,0,0,.6);
}
#measure-readout .val { color: #fff; font-weight: 600; }
#measure-readout .hint { font-size: 10.5px; color: #888; margin-top: 4px; }

#stats-widget {
  /* Bottom-anchored, not top: growing content pushes the top edge up instead of
     downward into the timeline bar below the map. left offset clears the scale control
     (also bottom-left) which sits underneath it. */
  position: absolute; left: 12px; bottom: 48px; z-index: 900;
  background: #1b1b1b; border: 1px solid #3a3a3a; border-radius: 8px;
  font-size: 12px; color: #ddd; display: none; max-width: 300px;
  box-shadow: 0 6px 24px rgba(0,0,0,.6); overflow: hidden;
}
#stats-widget .stats-head { padding: 8px 12px; cursor: pointer; font-weight: 600; color: #eee; white-space: nowrap; }
#stats-widget .stats-list { max-height: 260px; overflow-y: auto; padding: 4px 12px 8px; }
#stats-widget .stats-row { padding: 4px 0; border-bottom: 1px solid #2a2a2a; }
#stats-widget .stats-row:last-child { border-bottom: none; }
#stats-widget .stats-row-top { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: #bbb; }
#stats-widget .stats-row-areas { font-size: 10.5px; color: #888; margin-top: 2px; }
#last-updated { margin-left: auto; font-size: 11px; color: #555; }

#map-wrap { flex: 1; min-height: 0; position: relative; }
#map { position: absolute; inset: 0; }

#statusbar {
  padding: 5px 14px; font-size: 11px; color: #555;
  background: #161616; border-top: 1px solid #222;
  display: flex; gap: 16px; align-items: center; flex-shrink: 0;
}
#count { margin-left: auto; }
#status-msg.err { color: #b45c5c; }

.zone-popup { font-family: 'Segoe UI', sans-serif; min-width: 200px; }
.zone-popup h3 { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #eee; }
.zone-popup .meta { font-size: 11px; color: #888; margin: 2px 0; }
.zone-popup .faction-badge {
  display: inline-block; font-size: 11px; padding: 2px 9px;
  border-radius: 999px; margin: 4px 0 6px; font-weight: 500;
}
.zone-popup .snippet {
  font-size: 11px; color: #666; font-style: italic;
  margin-top: 6px; border-top: 1px solid #2a2a2a; padding-top: 6px;
}

.leaflet-popup-content-wrapper { background: #1e1e1e; color: #eee; border: 1px solid #333; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.6); }
.leaflet-popup-tip { background: #1e1e1e; }
.leaflet-popup-close-button { color: #666 !important; }
.leaflet-control-layers { background: #1e1e1e !important; border: 1px solid #333 !important; color: #ccc !important; }
.leaflet-control-layers label { color: #ccc; font-size: 12px; }
.leaflet-bar a { background: #222 !important; color: #ccc !important; border-color: #333 !important; }
.leaflet-bar a:hover { background: #2a2a2a !important; }

.basemap-switcher {
  background: #1e1e1e; border: 1px solid #333; border-radius: 8px;
  padding: 6px 10px 8px; font-size: 12px; color: #ccc; max-height: 340px; overflow-y: auto;
  box-shadow: 0 4px 20px rgba(0,0,0,.5);
}
.basemap-switcher .bs-group-title {
  font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  color: #fff; background: #2a2a3a; margin: 6px -10px 4px; padding: 4px 10px;
}
.basemap-switcher .bs-group-title:first-child { margin-top: -6px; }
.basemap-switcher .bs-row { display: flex; align-items: center; gap: 6px; padding: 2px 0 2px 2px; cursor: pointer; white-space: nowrap; }
.basemap-switcher .bs-row input { margin: 0; }
.leaflet-control-scale-line {
  background: rgba(20,20,20,.85) !important; color: #ddd !important;
  border-color: #666 !important; font-size: 11px !important;
}
.leaflet-control-attribution { background: rgba(20,20,20,.8) !important; color: #777 !important; }
.leaflet-control-attribution a { color: #999 !important; }

#history-panel {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 14px; background: #1a1a1a; border-top: 1px solid #2a2a2a; flex-shrink: 0;
}
#history-panel.hidden { display: none; }
#events-scroller {
  flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 2px 0;
}
.event-card {
  flex-shrink: 0; min-width: 150px; max-width: 220px; background: #202020;
  border: 1px solid #333; border-radius: 7px; padding: 6px 10px; cursor: pointer;
}
.event-card:hover { background: #262626; border-color: #444; }
.event-card .ec-date { font-size: 10px; color: #777; }
.event-card .ec-name { font-size: 12px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-card .ec-delta { font-size: 11px; font-weight: 600; }
.event-card .ec-delta.pos { color: #4ade80; }
.event-card .ec-delta.neg { color: #f87171; }
#history-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
#history-date {
  background: #242424; color: #eee; border: 1px solid #383838; border-radius: 6px;
  padding: 4px 8px; font-size: 12px;
}
#history-date::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
#history-live {
  font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  background: #242424; color: #ccc; border: 1px solid #383838;
}
#history-live.active { background: #1d4ed8; border-color: #2563eb; color: #fff; }
#history-live:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>

<div id="toolbar">
  <h1 id="app-title">⚔ CONFLICT MAP</h1>
  <button class="tool" id="tool-measure" title="Draw a polygon to measure its area and perimeter">📐 Measure</button>
  <button class="tool" id="tool-lang" title="Switch language">RU</button>
  <span id="last-updated">Loading…</span>
</div>

<div id="map-wrap">
  <div id="map"></div>
  <div id="measure-readout"></div>
  <div id="stats-widget"></div>
</div>

<div id="history-panel" class="hidden">
  <div id="events-scroller"></div>
  <div id="history-controls">
    <input type="date" id="history-date" title="Select a date to revert the frontline to how it looked at the end of that day"/>
    <button id="history-live" class="active" title="Return to the live, current frontline">● Live</button>
  </div>
</div>

<div id="statusbar">
  <span id="status-msg">Loading territory…</span>
  <span id="count"></span>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

<script>
// Faction ids, colours AND display names must stay identical to listener.py,
// bootstrap.html and editor.html (CONVENTIONS §5). The editor is the only writer,
// so an id that exists there and not here publishes territory this viewer renders
// grey. Rename factions in all four files in the same commit or not at all.
// A third (or later) side is just another entry here — every consumer (style lookups,
// contested pattern aside) reads this dynamically via FACTIONS[id]/Object.keys(FACTIONS)
// rather than assuming exactly two sides.
var FACTIONS = {
  "ukraine":   { name: "Ukraine",   color: "#3b82f6" },
  "russia":    { name: "Russia",    color: "#f87171" },
  "contested": { name: "Contested", color: "#f59e0b" },
  "neutral":   { name: "Neutral",   color: "#9ca3af" },
};

var REFRESH_MS = 60000;

// ── i18n: UI chrome only — settlement/place names are never translated here, see
// docs/CONVENTIONS.md §6 (Russian/Ukrainian name matching is already a known gap upstream,
// and zones.geojson stores only a single settlement_name — no ru/en variant to draw on).
var LANG_KEY = 'cv_lang';
var currentLang = localStorage.getItem(LANG_KEY) === 'ru' ? 'ru' : 'en';
function pluralRu(n, one, few, many) {
  var n100 = Math.abs(n) % 100, n10 = n100 % 10;
  if (n100 > 10 && n100 < 20) return many;
  if (n10 > 1 && n10 < 5) return few;
  if (n10 === 1) return one;
  return many;
}
var STRINGS = {
  en: {
    measure: '📐 Measure',
    measureTitle: 'Draw a polygon to measure its area and perimeter',
    langToggleTitle: 'Switch to Russian',
    loading: 'Loading…',
    refreshed: function (time) { return 'Refreshed ' + time; },
    loadingTerritory: 'Loading territory…',
    territoryLoaded: 'Territory loaded',
    controlAreasUnavailable: function (msg) { return 'Control areas unavailable (' + msg + ')'; },
    settlementZonesUnavailable: function (msg) { return 'Settlement zones unavailable (' + msg + ')'; },
    countAreas: function (n) { return n + ' area' + (n !== 1 ? 's' : ''); },
    countSettlements: function (n) { return n + ' settlement' + (n !== 1 ? 's' : ''); },
    statsHeader: 'Percent of controlled territories',
    ruPct: function (p) { return p + '% RU'; },
    rowAreas: function (ru, ua) { return 'Russia: ' + ru + ' km² · Ukraine: ' + ua + ' km²'; },
    historyDateTitle: 'Select a date to revert the frontline to how it looked at the end of that day',
    live: '● Live',
    liveTitle: 'Return to the live, current frontline',
    showingAsOf: function (d) { return 'Showing frontline as of end of ' + d; },
    measureArea: function (a) { return 'Area: <span class="val">' + a + ' km²</span>'; },
    measurePerimeter: function (p) { return 'Perimeter: <span class="val">' + p + ' km</span>'; },
    measureHint: 'Click to add a point · Enter to finish · Esc to cancel',
    deltaUnit: ' km²',
    unnamed: 'Unnamed',
    basemapMaps: 'Maps', basemapSatellite: 'Satellite', basemapTerrain: 'Terrain',
    layerOsm: 'OSM', layerYandexMap: 'Yandex (RU)', layerGoogleRoads: 'Google Roads',
    layerSatelliteEsri: 'Satellite (Esri)', layerYandexHybrid: 'Yandex Hybrid', layerGoogleHybrid: 'Google Hybrid',
    layerOpenTopo: 'OpenTopoMap',
  },
  ru: {
    measure: '📐 Измерить',
    measureTitle: 'Нарисуйте полигон, чтобы измерить площадь и периметр',
    langToggleTitle: 'Switch to English',
    loading: 'Загрузка…',
    refreshed: function (time) { return 'Обновлено ' + time; },
    loadingTerritory: 'Загрузка территории…',
    territoryLoaded: 'Территория загружена',
    controlAreasUnavailable: function (msg) { return 'Зоны контроля недоступны (' + msg + ')'; },
    settlementZonesUnavailable: function (msg) { return 'Зоны населённых пунктов недоступны (' + msg + ')'; },
    countAreas: function (n) { return n + ' ' + pluralRu(n, 'зона', 'зоны', 'зон'); },
    countSettlements: function (n) { return n + ' ' + pluralRu(n, 'нас. пункт', 'нас. пункта', 'нас. пунктов'); },
    statsHeader: 'Процент контролируемых территорий',
    ruPct: function (p) { return p + '% РФ'; },
    rowAreas: function (ru, ua) { return 'Россия: ' + ru + ' км² · Украина: ' + ua + ' км²'; },
    historyDateTitle: 'Выберите дату, чтобы вернуть линию фронта к состоянию на конец этого дня',
    live: '● Сейчас',
    liveTitle: 'Вернуться к текущей линии фронта',
    showingAsOf: function (d) { return 'Линия фронта на конец ' + d; },
    measureArea: function (a) { return 'Площадь: <span class="val">' + a + ' км²</span>'; },
    measurePerimeter: function (p) { return 'Периметр: <span class="val">' + p + ' км</span>'; },
    measureHint: 'Клик — добавить точку · Enter — завершить · Esc — отмена',
    deltaUnit: ' км²',
    unnamed: 'Без названия',
    basemapMaps: 'Карты', basemapSatellite: 'Спутник', basemapTerrain: 'Рельеф',
    layerOsm: 'OSM', layerYandexMap: 'Яндекс (рус)', layerGoogleRoads: 'Google Дороги',

    layerOpenTopo: 'OpenTopoMap',
  },
};
function t(key) { return STRINGS[currentLang][key]; }

// already publishes (sourced from oblasts.geojson); unrecognised names fall back to it as-is.

  'Миколаївська область':       { en: 'Mykolaiv Oblast',       ru: 'Николаевская область' },

  'Херсонська область':         { en: 'Kherson Oblast',        ru: 'Херсонская область' },
  'Хмельницька область':        { en: 'Khmelnytskyi Oblast',   ru: 'Хмельницкая область' },
  'Черкаська область':          { en: 'Cherkasy Oblast',       ru: 'Черкасская область' },
  'Чернівецька область':        { en: 'Chernivtsi Oblast',     ru: 'Черновицкая область' },
  'Чернігівська область':       { en: 'Chernihiv Oblast',      ru: 'Черниговская область' },
  'Автономна Республіка Крим':  { en: 'Crimea',                ru: 'Республика Крым' },
  'Севастополь':                { en: 'Sevastopol',            ru: 'Севастополь' },
};
function localizedOblastName(uaName) {
  var entry = OBLAST_NAMES[uaName];
  return entry ? entry[currentLang] : uaName;
}

// Russia's claimed administrative border within Ukraine — but only the segments that run
// between the 5 claimed regions (Crimea, 2014; Donetsk, Luhansk, Zaporizhzhia, Kherson
// oblasts, 2022) and other, non-claimed Ukrainian oblasts, independent of actual
// front-line control. Segments that instead fall on Ukraine's real national perimeter —
// the actual Russia/Belarus international border, or coastline — are deliberately
// omitted: that's not a claim boundary, it's just Russia's/the sea's own edge, and
// drawing a "claimed border" on top of it reads as if the claim extends past it.
// Hand-editable in code, not through a UI: each entry below is one open polyline of
// [lat, lng] pairs (NOT a closed ring — render as polylines, not polygons).
// Source: local oblasts.geojson (never published) — the 5 regions' polygons unioned
// (shapely unary_union) and simplified (100m tolerance, UTM 37N), then that union's
// boundary has the boundary of ALL Ukrainian oblasts unioned together (Ukraine's true
// national outline) subtracted from it, leaving only the inter-oblast segments.
// To adjust, edit the coordinates directly or regenerate via regenerate_claimed_border.py
// from an updated oblasts.geojson.

  if (layer === activeBasemap) return;

  layer.addTo(map);

// ── Fills: one pane, one canvas, opaque shapes ────────────────────────────────
// Mirrors bootstrap.html and editor.html. Per-feature fillOpacity composites wherever
// two polygons overlap and produces a colour nobody painted — a settlement zone sitting
// on a region of the SAME faction lights up as a different shade. Drawing every fill
// fully opaque into a single canvas and putting the translucency on the pane means
// whatever is drawn last simply replaces what is under it. Both groups must share
// `fillsR`: separate renderers mean separate canvases and the blending is back.
map.createPane('fills');
map.getPane('fills').style.zIndex = 400;
map.getPane('fills').style.opacity = '0.42';
var fillsR = L.canvas({ pane: 'fills', padding: 0.3 });

var regionLayer = null;   // control_regions.geojson — wholesale territory, drawn first
var zoneLayer   = null;   // zones.geojson — per-settlement claims, drawn on top

// Claimed-border overlay — a fixed reference line, not territory data, so it sits above the
// 'fills' pane (z-index 400) and is always visible regardless of basemap or fill opacity.
// CLAIMED_BORDER holds open polylines (front-line-only segments — see the comment above the
// array), not closed rings, so this draws as L.polyline, not L.polygon.
map.createPane('claimedBorder');
map.getPane('claimedBorder').style.zIndex = 450;
// A dark casing drawn first holds contrast on light and dark basemaps alike — a plain line
// washed out badly over satellite imagery. Solid, semi-transparent, no dash — matches the
// front-line style convention used elsewhere (thick translucent band, not a dashed outline).
L.polyline(CLAIMED_BORDER, {
  pane: 'claimedBorder', interactive: false,
  color: '#3a0a1f', weight: 6, opacity: 0.35, lineJoin: 'round', lineCap: 'round',
}).addTo(map);
L.polyline(CLAIMED_BORDER, {
  pane: 'claimedBorder', interactive: false,
  color: '#c2255c', weight: 4, opacity: 0.65, lineJoin: 'round', lineCap: 'round',
}).addTo(map);

// The 1px stroke is the fill colour, never a contrasting outline: it exists only to close
// the antialiased hairline between abutting polygons (CONVENTIONS §10).
// Contested = a real two-colour diagonal stripe pattern, not a third flat colour. Drawn as
// a CanvasPattern object so it can go through the same shared 'fills' canvas as every other
// faction — L.Canvas assigns options.fillColor/color straight to ctx.fillStyle/strokeStyle,
// which accept a CanvasPattern just as well as a string. A separate SVG-pattern renderer
// would mean a separate canvas and bring the cross-polygon blending problem back
// (CONVENTIONS §10), so this stays on-canvas instead.
// Recent-change variant per faction — highlights a feature changed within the last 24h (see
// isRecentChange() and the style callbacks in loadRegions/loadZones below). Not simply
// "brighter than base" for every faction: Ukraine's recent tint is a lighter blue than its
// base colour, but Russia's is deliberately a darker red than its (now lighter) base colour —
// newly-taken areas read as a deeper red against the lighter red of ground already held,
// rather than the other way around. Whichever direction, it must never read as a muddy grey
// smudge next to everything else.
var RECENT_COLORS = { ukraine: '#60a5fa', russia: '#ef4444' };

// STRIPE_BAND is the shared band width (px, at pattern-tile scale) for every hatch —
// contested (two-tone) and attack (one-tone-on-transparent) alike, so the two read as one
// visual family. Bands, not hairlines: each colour covers an equal, deliberately wide
// stripe. The two 45° strokes drawn per tile (see stripePattern() below) repeat with a
// perpendicular period of STRIPE_TILE/√2, not STRIPE_TILE itself, so a lineWidth of half
// the tile is too wide for that period and gives ~70/30 coverage, not 50/50 — confirmed by
// counting actual pixels in the rendered tile. Half of the true period is STRIPE_TILE/(2√2).
var STRIPE_TILE = 16, STRIPE_BAND = STRIPE_TILE / (2 * Math.SQRT2);
var _stripePatterns = {};
function stripePattern(key, strokeColor, bgColor) {
  if (_stripePatterns[key]) return _stripePatterns[key];
  var s = STRIPE_TILE, off = document.createElement('canvas');
  off.width = s; off.height = s;
  var octx = off.getContext('2d');
  if (bgColor) { octx.fillStyle = bgColor; octx.fillRect(0, 0, s, s); }
  // else: left transparent — an attack hatch shows whatever is underneath in the gaps
  // between bands (basemap, or a region this zone sits on top of), matching the reference
  // "movement / advance" hatching, which is not a flat third colour like contested is.
  octx.strokeStyle = strokeColor;
  octx.lineWidth = STRIPE_BAND;
  octx.beginPath();
  octx.moveTo(-s * 0.5, s); octx.lineTo(s, -s * 0.5);
  octx.moveTo(0, s * 1.5); octx.lineTo(s * 1.5, 0);
  octx.stroke();

  return _stripePatterns[key];

// Pulls from FACTIONS/RECENT_COLORS rather than its own hex literals so the contested
// pattern's red/blue bands can never drift out of sync with the flat faction colours used
// everywhere else — they did, once, when RECENT_COLORS.russia stopped being "brighter than
// base" for Russia specifically (see the comment above RECENT_COLORS).
function contestedPattern(recent) {
  return recent
    ? stripePattern('contested_r', RECENT_COLORS.ukraine, RECENT_COLORS.russia)
    : stripePattern('contested_n', FACTIONS.ukraine.color, FACTIONS.russia.color);
}
function attackPattern(faction_id, recent) {
  var f = FACTIONS[faction_id] || { color: '#555555' };
  var color = (recent && RECENT_COLORS[faction_id]) || f.color;
  return stripePattern('attack_' + faction_id + (recent ? '_r' : '_n'), color, null);
}
function isRecentChange(iso) {
  if (!iso) return false;
  var t = new Date(iso).getTime();
  return !isNaN(t) && (Date.now() - t) < 24 * 3600 * 1000;
}
// pattern: undefined/"solid" → flat faction colour; "attack" → faction-colour hatch.
// faction_id "contested" always wins regardless of `pattern` — contested is a stance
// between two factions, not a style applied to one, so it does not compose with "attack".
function factionStyle(faction_id, pattern, recent) {
  var f = FACTIONS[faction_id] || { color: "#555555" };
  var paint = faction_id === 'contested'
    ? contestedPattern(recent)
    : pattern === 'attack'
    ? attackPattern(faction_id, recent)
    : (recent && RECENT_COLORS[faction_id]) || f.color;
  return {
    pane: 'fills', renderer: fillsR,
    color: paint, fillColor: paint,
    fillOpacity: 1, weight: 1, opacity: 1, lineJoin: 'round',

function formatDate(iso) {
  if (!iso) return "unknown";
  var d = new Date(iso);
  if (isNaN(d)) return "unknown";
  return d.toLocaleString(undefined, {
    month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
  });
}

function factionBadge(fid) {
  var f = FACTIONS[fid] || { name: fid || "unknown", color: "#888" };
  return '<span class="faction-badge" style="background:' + f.color + '22;color:' + f.color
       + ';border:1px solid ' + f.color + '44">' + f.name + '</span>';
}

// Zones and regions are different documents with different schemas — a region has no

function zonePopup(p) {

    + '<h3>' + (p.settlement_name || "Unnamed") + '</h3>'

    + (p.admin_area_km2  ? '<p class="meta">Admin boundary: ' + p.admin_area_km2 + ' km²</p>' : '')
    + (p.zone_area_km2   ? '<p class="meta">Controlled zone: ' + p.zone_area_km2 + ' km²</p>' : '')
    + (p.source_snippet  ? '<p class="snippet">"' + p.source_snippet.substring(0, 120) + '…"</p>' : '')
    + '</div>';
}

function regionPopup(p) {
  return '<div class="zone-popup">'
    + '<h3>' + (p.name || "Unnamed area") + '</h3>'
    + factionBadge(p.faction)
    + (p.zone_type ? '<p class="meta">Type: ' + p.zone_type + '</p>' : '')
    + '<p class="meta">Updated: ' + formatDate(p.last_updated) + '</p>'
    + '</div>';
}

// ── Loading ───────────────────────────────────────────────────────────────────
// The two files are independent documents fetched independently: one missing or
// malformed must not blank the other. Counts are tracked separately so the status bar
// can say which half is live.
var counts = { zones: null, regions: null };
var errors = { zones: null, regions: null };

function report() {
  var msgEl = document.getElementById('status-msg');
  var errMsgs = [];
  if (errors.regions) errMsgs.push(t('controlAreasUnavailable')(errors.regions));
  if (errors.zones)   errMsgs.push(t('settlementZonesUnavailable')(errors.zones));

  var stillLoading = counts.zones === null && counts.regions === null;
  if (errMsgs.length) {
    msgEl.textContent = errMsgs.join(' · ');
    msgEl.className = 'err';
  } else {
    msgEl.textContent = stillLoading ? t('loadingTerritory') : t('territoryLoaded');
    msgEl.className = '';
  }

  var z = counts.zones, r = counts.regions;
  document.getElementById('count').textContent =
    (r === null ? '' : t('countAreas')(r) + ' · ')
    + (z === null ? '' : t('countSettlements')(z));
  document.getElementById('last-updated').textContent =
    stillLoading ? t('loading') : t('refreshed')(new Date().toLocaleTimeString());
}

// Settlement zones come from independent per-settlement raster grids (one WMS tile +
// contour pass per settlement) and oblast/region fills are drawn as separate polygons, so
// two neighbouring same-faction shapes can land a few metres short of truly touching — a
// thin gap, or a hole in the fill wholly surrounded by one faction's colour. A fixed-pixel
// stroke can't close this correctly at every zoom level (the same real-world gap gets wider
// in screen pixels the further in you zoom), so this buffers every fill polygon outward by a
// small real-world distance before rendering. Cosmetic only — never written back to the data.
var GAP_CLOSE_M = 15;
function closeGaps(fc) {
  if (typeof turf === 'undefined') return fc;
  var out = [];
  (fc.features || []).forEach(function (f) {
    if (!f.geometry) return;
    var b = null;
    try { b = turf.buffer(f, GAP_CLOSE_M, { units: 'meters' }); } catch (e) {}
    if (b) { b.properties = f.properties; out.push(b); }
    else out.push(f);
  });
  return { type: 'FeatureCollection', features: out };
}

// Draw order inside the shared canvas is add order, and the two fetches race — so
// ordering is asserted after each load rather than left to whichever returned last.
function restack() {
  if (zoneLayer && zoneLayer.bringToFront) { try { zoneLayer.bringToFront(); } catch (e) {} }
}

// Raw (pre-closeGaps) fetched data, kept so the historical calendar view (below) can
// reconstruct a past date's state from the same source the live view uses.
var rawZonesFC   = { type: 'FeatureCollection', features: [] };
var rawRegionsFC = { type: 'FeatureCollection', features: [] };
var selectedDate = null;   // non-null while viewing a past date instead of the live fetch

// pane and renderer are constructor-time options — Leaflet applies them via geometryToLayer,
// not via setStyle. Returning them from the style function alone silently drops both and
// every fill lands in the default overlay pane at full opacity.
// Regions are wholesale territory, often a huge oblast-sized shape — flagging the whole
// thing "recent" for every geometry nudge (meld, cut, redraw, repair) reads as if the whole
// oblast just changed hands when really a sliver got trimmed off one corner. Only a genuine
// oblast-tool faction reassignment (or brand-new oblast-tool add) is newsworthy enough to
// light up the whole shape, so this keys off faction_set_at — stamped ONLY by oblastClick()
// in editor.html, never by geometry-only edits — not last_updated, which every touch-up
// bumps. Zones stay keyed off last_updated as before: a settlement-sized area lighting up
// for any edit (including an addition to it) is proportionate.
function isRecentRegion(p) {
  return p.zone_type === 'oblast' && isRecentChange(p.faction_set_at);
}
function paintStyle(p, highlightIds, isRegion) {
  var recent = highlightIds
    ? highlightIds.has(p.id)
    : isRegion ? isRecentRegion(p) : isRecentChange(p.last_updated);
  return factionStyle(p.faction, p.pattern, recent);
}
function renderRegionsLayer(data, highlightIds) {
  if (regionLayer) map.removeLayer(regionLayer);
  regionLayer = L.geoJSON(closeGaps(data), {
    pane: 'fills', renderer: fillsR,
    style: function (f) { return paintStyle(f.properties || {}, highlightIds, true); },
  }).addTo(map);
}
function renderZonesLayer(data, highlightIds) {
  if (zoneLayer) map.removeLayer(zoneLayer);
  zoneLayer = L.geoJSON(closeGaps(data), {
    pane: 'fills', renderer: fillsR,
    style: function (f) { return paintStyle(f.properties || {}, highlightIds, false); },
  }).addTo(map);
}

function loadRegions() {
  fetch('control_regions.geojson?_=' + Date.now())
    .then(function (r) {
      if (r.status === 404) { var e = new Error('missing'); e.missing = true; throw e; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      rawRegionsFC = data;
      if (!selectedDate) renderRegionsLayer(data, null);
      counts.regions = (data.features || []).length;
      errors.regions = null;
      restack();
      report();
    })
    .catch(function (err) {
      // A repo with no wholesale territory yet is a valid state, not a failure.
      if (err.missing) { counts.regions = 0; errors.regions = null; }
      else errors.regions = err.message;
      report();
    });
}

function loadZones() {
  fetch('zones.geojson?_=' + Date.now())
    .then(function (r) {
      if (r.status === 404) { var e = new Error('missing'); e.missing = true; throw e; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      rawZonesFC = data;
      if (!selectedDate) renderZonesLayer(data, null);
      counts.zones = (data.features || []).length;
      errors.zones = null;
      restack();
      report();
    })
    .catch(function (err) {
      if (err.missing) { counts.zones = 0; errors.zones = null; }
      else errors.zones = err.message;
      report();
    });
}

// ── Territory-held-per-side stats widget ────────────────────────────────────────────
// Displays editor.html's precomputed territory_stats.json (see computeTerritoryStats()
// there) — no oblast geometry or turf work needed on the public viewer for this.
var statsMinimized = true;
var lastStats = null;

function renderStats() {
  var box = document.getElementById('stats-widget');
  var totals = lastStats && lastStats.totals;
  if (!totals || !totals.total_km2) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  var fmtArea = function (v) { return Math.round(v).toLocaleString(); };

  if (statsMinimized) {
    box.innerHTML = '<div class="stats-head" id="stats-toggle">' + t('statsHeader') + ' ▸</div>';
  } else {
    var rows = lastStats.oblasts.slice()
      .filter(function (o) { return o.total_km2 > 0 && (100 * o.russia_km2 / o.total_km2) >= 1; })
      .sort(function (a, b) { return b.russia_km2 - a.russia_km2; })
      .map(function (o) {
        return '<div class="stats-row">'
          + '<div class="stats-row-top"><span>' + localizedOblastName(o.name) + '</span><span>'
          + t('ruPct')((100 * o.russia_km2 / o.total_km2).toFixed(0)) + '</span></div>'
          + '<div class="stats-row-areas">' + t('rowAreas')(fmtArea(o.russia_km2), fmtArea(o.ukraine_km2)) + '</div>'
          + '</div>';
      }).join('');
    box.innerHTML = '<div class="stats-head" id="stats-toggle">' + t('statsHeader') + ' ▾</div>'
      + '<div class="stats-list">' + rows + '</div>';
  }
  document.getElementById('stats-toggle').addEventListener('click', function () {
    statsMinimized = !statsMinimized;
    renderStats();
  });
}

function loadStats() {
  fetch('territory_stats.json?_=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) { lastStats = data; renderStats(); })
    .catch(function () { lastStats = null; document.getElementById('stats-widget').style.display = 'none'; });
}

// ── Frontline history: events scroller + calendar revert ───────────────────────────
// Fetches editor.html's rolling-window frontline_history.json (see computeFrontlineHistory()
// there). Reconstructing a past date works backward from the LIVE state: for each feature,
// only the earliest history entry after the target date matters — its base_geometry/
// prev_faction already is that feature's exact state as of the end of the target date,
// since that entry's bucket opened with exactly that state. No need to chain through every
// day in between.
var lastHistory = null;

// Entries dated before this are edits made while wiring this feature up, not real
// frontline changes — hidden from the public timeline. Real entries resume 2026-08-06.
var HISTORY_VISIBLE_FROM = '2026-08-06';

function loadHistory() {
  fetch('frontline_history.json?_=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var entries = (data.entries || []).filter(function (e) { return e.date >= HISTORY_VISIBLE_FROM; });
      lastHistory = Object.assign({}, data, { entries: entries });
      document.getElementById('history-panel').classList.remove('hidden');
      var dates = entries.map(function (e) { return e.date; });
      var dateInput = document.getElementById('history-date');
      if (dates.length) {
        dateInput.min = dates[0];
        dateInput.max = todayIso();
      }
      renderEventsScroller();
    })
    .catch(function () {
      lastHistory = null;
      document.getElementById('history-panel').classList.add('hidden');
    });
}

function todayIso() {
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function featureBoundsFromGeom(geom) {
  if (!geom) return null;
  try { return L.geoJSON(geom).getBounds(); } catch (e) { return null; }
}

function renderEventsScroller() {
  var box = document.getElementById('events-scroller');
  if (!lastHistory || !lastHistory.entries.length) { box.innerHTML = ''; return; }
  // Flattened across all days, oldest first — the most recent change is the last card.
  var cards = [];
  lastHistory.entries.forEach(function (e) {
    e.changes.forEach(function (c) { cards.push({ date: e.date, c: c }); });
  });
  box.innerHTML = '';
  cards.forEach(function (item) {
    var c = item.c;
    var delta = c.area_delta_km2 || 0;
    // c.name is the canonical (Russian) name; c.name_en is optional and only shown in
    // English mode, falling back to c.name when the operator never set one.
    var displayName = (currentLang === 'en' && c.name_en) ? c.name_en : c.name;
    var el = document.createElement('div');
    el.className = 'event-card';
    el.innerHTML = '<div class="ec-date">' + item.date + '</div>'
      + '<div class="ec-name">' + esc(displayName || t('unnamed')) + '</div>'
      + '<div class="ec-delta ' + (delta >= 0 ? 'pos' : 'neg') + '">'
      + (delta >= 0 ? '+' : '') + delta.toFixed(1) + t('deltaUnit') + '</div>';
    el.addEventListener('click', function () {
      var b = featureBoundsFromGeom(c.geometry || c.base_geometry);
      if (b && b.isValid()) map.fitBounds(b, { maxZoom: 12 });
    });
    box.appendChild(el);
  });
  box.scrollLeft = box.scrollWidth; // most recent (last) card starts in view
}
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

// Reconstructs state as of the end of targetDate (YYYY-MM-DD) from the live raw fetch plus
// every history entry dated after it. Returns { zones, regions, changedZoneIds, changedRegionIds }.
function reconstructStateAsOf(targetDate) {
  var working = new Map();   // id -> { kind, feature }
  (rawZonesFC.features || []).forEach(function (f) {
    if (f.properties && f.properties.id) working.set(f.properties.id, { kind: 'zone', f: f });
  });
  (rawRegionsFC.features || []).forEach(function (f) {
    if (f.properties && f.properties.id) working.set(f.properties.id, { kind: 'region', f: f });
  });

  var earliest = new Map();  // id -> change, from the earliest date > targetDate
  (lastHistory.entries || [])
    .filter(function (e) { return e.date > targetDate; })
    .slice()
    .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })
    .forEach(function (e) {
      e.changes.forEach(function (c) { if (!earliest.has(c.id)) earliest.set(c.id, c); });
    });

  earliest.forEach(function (c, id) {
    if (c.action === 'add') {
      working.delete(id);   // did not exist as of targetDate
      return;
    }
    if (c.action === 'remove') {
      var nameKey = c.kind === 'zone' ? 'settlement_name' : 'name';
      var props = { id: id };
      props[nameKey] = c.prev_name || c.name;
      props.faction = c.prev_faction;
      working.set(id, { kind: c.kind, f: { type: 'Feature', properties: props, geometry: c.base_geometry } });
      return;
    }
    // update
    var cur = working.get(id);
    if (!cur) return;
    var props2 = Object.assign({}, cur.f.properties);
    if (c.prev_faction) props2.faction = c.prev_faction;
    if (c.prev_name) props2[c.kind === 'zone' ? 'settlement_name' : 'name'] = c.prev_name;
    working.set(id, {
      kind: cur.kind,
      f: { type: 'Feature', properties: props2, geometry: c.base_geometry || cur.f.geometry },
    });
  });

  var zones = [], regions = [];
  working.forEach(function (v) { (v.kind === 'zone' ? zones : regions).push(v.f); });

  // Same rule as isRecentRegion() for the live view: a region only belongs in the
  // "changed" set if the change was a genuine oblast-tool faction event (add or
  // reassignment), not a geometry-only touch-up — otherwise browsing history would light
  // up a whole oblast for every meld/cut/redraw that happened to land on target date + 1.
  var changedZoneIds = new Set(), changedRegionIds = new Set();
  earliest.forEach(function (c, id) {
    if (c.kind === 'zone') { changedZoneIds.add(id); return; }
    var cur = working.get(id);
    var isOblast = cur && cur.f && cur.f.properties && cur.f.properties.zone_type === 'oblast';
    var isFactionEvent = c.action === 'add' || (c.fields || []).indexOf('faction') !== -1;
    if (isOblast && isFactionEvent) changedRegionIds.add(id);
  });

  return {
    zones: { type: 'FeatureCollection', features: zones },
    regions: { type: 'FeatureCollection', features: regions },
    changedZoneIds: changedZoneIds,
    changedRegionIds: changedRegionIds,
  };
}

function showHistoricalDate(targetDate) {
  if (!lastHistory) return;
  selectedDate = targetDate;
  var result = reconstructStateAsOf(targetDate);
  renderRegionsLayer(result.regions, result.changedRegionIds);
  renderZonesLayer(result.zones, result.changedZoneIds);
  restack();
  document.getElementById('history-live').classList.remove('active');
  document.getElementById('history-live').disabled = false;
  document.getElementById('status-msg').textContent = t('showingAsOf')(targetDate);
  document.getElementById('status-msg').className = '';
}
function showLive() {
  selectedDate = null;
  document.getElementById('history-date').value = '';
  document.getElementById('history-live').classList.add('active');
  renderRegionsLayer(rawRegionsFC, null);
  renderZonesLayer(rawZonesFC, null);
  restack();
  report();
}

document.getElementById('history-date').addEventListener('change', function (e) {
  if (e.target.value) showHistoricalDate(e.target.value);
});
document.getElementById('history-live').addEventListener('click', showLive);

function refresh() { loadRegions(); loadZones(); loadStats(); loadHistory(); }

// ── Measure tool: draw a polygon, report area (km²) and perimeter (km) ─────────────
// A public-viewer aid, not territory data — its own pane with a dashed outline, so it
// isn't subject to the opaque-shared-canvas rule (CONVENTIONS §10), which only governs
// tools that draw territory.
map.createPane('measure');
map.getPane('measure').style.zIndex = 650;

var measureActive = false;
var measurePoints = [];   // [lat, lng] vertices, in click order
var measureShape  = null; // L.Polygon (>=3 points) or L.Polyline preview
var measureDots   = [];   // small vertex markers

// Same spherical geodesic ring-area formula as editor.html's ringAreaM2().
function ringAreaM2(coords) {   // coords: [[lng,lat], ...]
  var R = 6378137, total = 0, len = coords.length;
  if (len < 3) return 0;
  var rad = Math.PI / 180;
  for (var i = 0; i < len; i++) {
    var p1 = coords[i], p2 = coords[(i + 1) % len];
    total += (p2[0] - p1[0]) * rad * (2 + Math.sin(p1[1] * rad) + Math.sin(p2[1] * rad));
  }
  return Math.abs(total * R * R / 2);
}
function haversineM(a, b) {   // a, b: [lat, lng]
  var R = 6378137, rad = Math.PI / 180;
  var dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  var s = Math.sin(dLat / 2) * Math.sin(dLat / 2)
        + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(s));
}

function measureRedraw() {
  if (measureShape) { map.removeLayer(measureShape); measureShape = null; }
  measureDots.forEach(function (d) { map.removeLayer(d); });
  measureDots = [];

  measurePoints.forEach(function (pt) {
    measureDots.push(L.circleMarker(pt, {
      pane: 'measure', radius: 3, color: '#fff', weight: 1, fillColor: '#22c55e', fillOpacity: 1,
    }).addTo(map));
  });

  if (measurePoints.length > 1) {
    var opts = {
      pane: 'measure', color: '#22c55e', weight: 2, dashArray: '6,5',
      fillColor: '#22c55e', fillOpacity: measurePoints.length > 2 ? 0.12 : 0,
    };
    measureShape = measurePoints.length > 2
      ? L.polygon(measurePoints, opts).addTo(map)
      : L.polyline(measurePoints, opts).addTo(map);
  }
  updateMeasureReadout();
}

function updateMeasureReadout() {
  var box = document.getElementById('measure-readout');
  if (!measurePoints.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';

  var perimM = 0;
  for (var i = 0; i < measurePoints.length - 1; i++) perimM += haversineM(measurePoints[i], measurePoints[i + 1]);
  var areaKm2 = 0;
  if (measurePoints.length > 2) {
    perimM += haversineM(measurePoints[measurePoints.length - 1], measurePoints[0]); // closing edge
    var ring = measurePoints.map(function (p) { return [p[1], p[0]]; }); // ringAreaM2 wants [lng,lat]
    areaKm2 = ringAreaM2(ring) / 1e6;
  }
  box.innerHTML = (measurePoints.length > 2
      ? t('measureArea')(areaKm2.toFixed(2)) + '<br>' : '')
    + t('measurePerimeter')((perimM / 1000).toFixed(2))
    + (measureActive ? '<div class="hint">' + t('measureHint') + '</div>' : '');
}

function setMeasureActive(on) {
  measureActive = on;
  document.getElementById('tool-measure').classList.toggle('active', on);
  document.getElementById('map').classList.toggle('measuring', on);
  if (on) { measurePoints = []; measureRedraw(); }
  else { updateMeasureReadout(); }
}
document.getElementById('tool-measure').addEventListener('click', function () {
  setMeasureActive(!measureActive);
});
map.on('click', function (e) {
  if (!measureActive) return;
  measurePoints.push([e.latlng.lat, e.latlng.lng]);
  measureRedraw();
});
document.addEventListener('keydown', function (e) {
  if (!measureActive) return;
  if (e.key === 'Escape') { measurePoints = []; measureRedraw(); setMeasureActive(false); }
  else if (e.key === 'Enter') { setMeasureActive(false); }
});

// ── Language toggle ─────────────────────────────────────────────────────────────────
// Re-renders every bit of UI chrome from t(); anything driven by live data (report(),
// renderStats(), renderEventsScroller()) is safe to call any time since it reads current
// state rather than caching text. The basemap switcher is rebuilt from scratch since its
// labels are baked in at construction time by buildBasemapControl().
function renderStaticChrome() {
  // app-title is a fixed brand name — "CONFLICT MAP" stays in English in both languages,
  // unlike everything else here, so it deliberately isn't driven by t().
  var measureBtn = document.getElementById('tool-measure');
  measureBtn.textContent = t('measure');
  measureBtn.title = t('measureTitle');
  var langBtn = document.getElementById('tool-lang');
  langBtn.textContent = currentLang === 'en' ? 'RU' : 'EN';
  langBtn.title = t('langToggleTitle');
  document.getElementById('history-date').title = t('historyDateTitle');
  var liveBtn = document.getElementById('history-live');
  liveBtn.textContent = t('live');
  liveBtn.title = t('liveTitle');
}
function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(LANG_KEY, lang);
  renderStaticChrome();
  report();
  renderStats();
  renderEventsScroller();
  rebuildBasemapControl();
  updateMeasureReadout();
  if (selectedDate) {
    document.getElementById('status-msg').textContent = t('showingAsOf')(selectedDate);
  }
}
document.getElementById('tool-lang').addEventListener('click', function () {
  setLanguage(currentLang === 'en' ? 'ru' : 'en');
});
renderStaticChrome();
report();

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>

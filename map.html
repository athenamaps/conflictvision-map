<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Conflict Map</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #111; color: #eee; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

#toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 9px 14px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
  z-index: 1000; flex-shrink: 0;
}
#toolbar h1 { font-size: 13px; font-weight: 600; color: #bbb; letter-spacing: .06em; }
.tool {
  font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  background: #242424; color: #ccc; border: 1px solid #383838;
}
.tool:hover { background: #2e2e2e; }
.tool.active { background: #1d4ed8; border-color: #2563eb; color: #fff; }
#map.measuring { cursor: crosshair; }
#measure-readout {
  position: absolute; right: 12px; bottom: 12px; z-index: 900;
  background: #1b1b1b; border: 1px solid #3a3a3a; border-radius: 8px;
  padding: 9px 12px; font-size: 12px; color: #ddd; display: none;
  box-shadow: 0 6px 24px rgba(0,0,0,.6);
}
#measure-readout .val { color: #fff; font-weight: 600; }
#measure-readout .hint { font-size: 10.5px; color: #888; margin-top: 4px; }

#stats-widget {
  /* Bottom-anchored, not top: growing content pushes the top edge up instead of
     downward into the timeline bar below the map. left offset clears the scale control
     (also bottom-left) which sits underneath it. */
  position: absolute; left: 12px; bottom: 48px; z-index: 900;
  background: #1b1b1b; border: 1px solid #3a3a3a; border-radius: 8px;
  font-size: 12px; color: #ddd; display: none; max-width: 300px;
  box-shadow: 0 6px 24px rgba(0,0,0,.6); overflow: hidden;
}
#stats-widget .stats-head { padding: 8px 12px; cursor: pointer; font-weight: 600; color: #eee; white-space: nowrap; }
/* Tall enough that the list does not need a scrollbar. A row measures ~42px, and
   territory_stats.json currently carries 9 oblasts (~378px), so 420px leaves room for a
   tenth rather than sitting exactly on the current count — computeTerritoryStats() only
   emits oblasts with some non-Ukrainian presence, so the row count grows with the front.
   The viewport-relative cap is a fallback, not the target: it only bites on a short window,
   and on one the panel has to give somewhere. */
#stats-widget .stats-list { max-height: min(420px, calc(100vh - 240px)); overflow-y: auto; padding: 4px 12px 8px; }
#stats-widget .stats-row { padding: 4px 0; border-bottom: 1px solid #2a2a2a; }
#stats-widget .stats-row:last-child { border-bottom: none; }
#stats-widget .stats-row-top { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: #bbb; }
#stats-widget .stats-row-areas { font-size: 10.5px; color: #888; margin-top: 2px; }
#last-updated { margin-left: auto; font-size: 11px; color: #555; }

#map-wrap { flex: 1; min-height: 0; position: relative; }
#map { position: absolute; inset: 0; }

#statusbar {
  padding: 5px 14px; font-size: 11px; color: #555;
  background: #161616; border-top: 1px solid #222;
  display: flex; gap: 16px; align-items: center; flex-shrink: 0;
}
#count { margin-left: auto; }
#status-msg.err { color: #b45c5c; }

.zone-popup { font-family: 'Segoe UI', sans-serif; min-width: 200px; }
.zone-popup h3 { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #eee; }
.zone-popup .meta { font-size: 11px; color: #888; margin: 2px 0; }
.zone-popup .faction-badge {
  display: inline-block; font-size: 11px; padding: 2px 9px;
  border-radius: 999px; margin: 4px 0 6px; font-weight: 500;
}
.zone-popup .snippet {
  font-size: 11px; color: #666; font-style: italic;
  margin-top: 6px; border-top: 1px solid #2a2a2a; padding-top: 6px;
}

.leaflet-popup-content-wrapper { background: #1e1e1e; color: #eee; border: 1px solid #333; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.6); }
.leaflet-popup-tip { background: #1e1e1e; }
.leaflet-popup-close-button { color: #666 !important; }
.leaflet-control-layers { background: #1e1e1e !important; border: 1px solid #333 !important; color: #ccc !important; }
.leaflet-control-layers label { color: #ccc; font-size: 12px; }
.leaflet-bar a { background: #222 !important; color: #ccc !important; border-color: #333 !important; }
.leaflet-bar a:hover { background: #2a2a2a !important; }

.basemap-switcher {
  background: #1e1e1e; border: 1px solid #333; border-radius: 8px;
  padding: 6px 10px 8px; font-size: 12px; color: #ccc; max-height: 340px; overflow-y: auto;
  box-shadow: 0 4px 20px rgba(0,0,0,.5);
}
.basemap-switcher .bs-group-title {
  font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  color: #fff; background: #2a2a3a; margin: 6px -10px 4px; padding: 4px 10px;
}
.basemap-switcher .bs-group-title:first-child { margin-top: -6px; }
.basemap-switcher .bs-row { display: flex; align-items: center; gap: 6px; padding: 2px 0 2px 2px; cursor: pointer; white-space: nowrap; }
.basemap-switcher .bs-row input { margin: 0; }
.leaflet-control-scale-line {
  background: rgba(20,20,20,.85) !important; color: #ddd !important;
  border-color: #666 !important; font-size: 11px !important;
}
.leaflet-control-attribution { background: rgba(20,20,20,.8) !important; color: #777 !important; }
.leaflet-control-attribution a { color: #999 !important; }

#history-panel {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 14px; background: #1a1a1a; border-top: 1px solid #2a2a2a; flex-shrink: 0;
}
#history-panel.hidden { display: none; }
/* Collapsed is the default state (historyCollapsed below) — the bar costs the map a strip of
   height every viewer pays for whether or not they came for the history, so it starts as
   just its own title and opens on a click. */
#history-panel.collapsed #events-scroller,
#history-panel.collapsed #history-controls { display: none; }
#history-toggle {
  background: none; border: none; color: #bbb; font: 600 12px 'Segoe UI', sans-serif;
  cursor: pointer; padding: 4px 6px; white-space: nowrap; flex-shrink: 0;
}
#history-toggle:hover { color: #fff; }
#events-scroller {
  flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 2px 0;
}
.event-card {
  flex-shrink: 0; min-width: 150px; max-width: 220px; background: #202020;
  border: 1px solid #333; border-radius: 7px; padding: 6px 10px; cursor: pointer;
}
.event-card:hover { background: #262626; border-color: #444; }
.event-card .ec-date { font-size: 10px; color: #777; }
.event-card .ec-name { font-size: 12px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Coloured per gaining faction, inline from FACTIONS, rather than green-up/red-down: the
   card names a side that gained, so "positive" and "negative" have no meaning on their own —
   every counter shown is a gain for somebody. Contested and attack-hatch cards carry no
   counter at all and simply omit this element (see eventGainLabel()). */
.event-card .ec-delta { font-size: 11px; font-weight: 600; }
/* The citation behind the change — a link the operator masked behind a label, or plain text.
   Kept to one line: the card is a scroller item, not a place to read a paragraph. */
.event-card .ec-source { font-size: 10.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-card .ec-source a { color: #7aa2d8; text-decoration: none; }
.event-card .ec-source a:hover { color: #a8c6ee; text-decoration: underline; }
.event-card .ec-source .plain { color: #8a8a8a; }
#history-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
#history-date {
  background: #242424; color: #eee; border: 1px solid #383838; border-radius: 6px;
  padding: 4px 8px; font-size: 12px;
}
#history-date::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
#history-live {
  font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  background: #242424; color: #ccc; border: 1px solid #383838;
}
#history-live.active { background: #1d4ed8; border-color: #2563eb; color: #fff; }
#history-live:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>

<div id="toolbar">
  <h1 id="app-title">⚔ CONFLICT MAP</h1>
  <button class="tool" id="tool-measure" title="Draw a polygon to measure its area and perimeter">📐 Measure</button>
  <button class="tool" id="tool-lang" title="Switch language">RU</button>
  <span id="last-updated">Loading…</span>
</div>

<div id="map-wrap">
  <div id="map"></div>
  <div id="measure-readout"></div>
  <div id="stats-widget"></div>
</div>

<div id="history-panel" class="hidden collapsed">
  <button id="history-toggle">Timeline ▸</button>
  <div id="events-scroller"></div>
  <div id="history-controls">
    <input type="date" id="history-date" title="Select a date to revert the frontline to how it looked at the end of that day"/>
    <button id="history-live" class="active" title="Return to the live, current frontline">● Live</button>
  </div>
</div>

<div id="statusbar">
  <span id="status-msg">Loading territory…</span>
  <span id="count"></span>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

<script>
// Faction ids, colours AND display names must stay identical to listener.py,
// bootstrap.html and editor.html (CONVENTIONS §5). The editor is the only writer,
// so an id that exists there and not here publishes territory this viewer renders
// grey. Rename factions in all four files in the same commit or not at all.
// A third (or later) side is just another entry here — every consumer (style lookups,
// contested pattern aside) reads this dynamically via FACTIONS[id]/Object.keys(FACTIONS)
// rather than assuming exactly two sides.
var FACTIONS = {
  "ukraine":   { name: "Ukraine",   color: "#3b82f6" },
  "russia":    { name: "Russia",    color: "#f87171" },
  "contested": { name: "Contested", color: "#f59e0b" },
  "neutral":   { name: "Neutral",   color: "#9ca3af" },
};

var REFRESH_MS = 60000;

// ── i18n: UI chrome only — settlement/place names are never translated here, see
// docs/CONVENTIONS.md §6 (Russian/Ukrainian name matching is already a known gap upstream,
// and control_regions.geojson stores only a single canonical name plus the optional
// name_en used above — no separate ru variant to draw on).
var LANG_KEY = 'cv_lang';
var currentLang = localStorage.getItem(LANG_KEY) === 'ru' ? 'ru' : 'en';
function pluralRu(n, one, few, many) {
  var n100 = Math.abs(n) % 100, n10 = n100 % 10;
  if (n100 > 10 && n100 < 20) return many;
  if (n10 > 1 && n10 < 5) return few;
  if (n10 === 1) return one;
  return many;
}
var STRINGS = {
  en: {
    measure: '📐 Measure',
    measureTitle: 'Draw a polygon to measure its area and perimeter',
    langToggleTitle: 'Switch to Russian',
    loading: 'Loading…',
    refreshed: function (time) { return 'Refreshed ' + time; },
    loadingTerritory: 'Loading territory…',
    territoryLoaded: 'Territory loaded',
    controlAreasUnavailable: function (msg) { return 'Control areas unavailable (' + msg + ')'; },
    countAreas: function (n) { return n + ' area' + (n !== 1 ? 's' : ''); },
    statsHeader: 'Percent of controlled territories',
    ruPct: function (p) { return p + '% RU'; },
    rowAreas: function (ru, ua) { return 'Russia: ' + ru + ' km² · Ukraine: ' + ua + ' km²'; },
    timelineHeader: 'Timeline',
    timelineToggleTitle: 'Show or hide the timeline of recent changes',
    historyDateTitle: 'Select a date to revert the frontline to how it looked at the end of that day',
    live: '● Live',
    liveTitle: 'Return to the live, current frontline',
    showingAsOf: function (d) { return 'Showing frontline as of end of ' + d; },
    measureArea: function (a) { return 'Area: <span class="val">' + a + ' km²</span>'; },
    measurePerimeter: function (p) { return 'Perimeter: <span class="val">' + p + ' km</span>'; },
    measureHint: 'Click to add a point · Enter to finish · Esc to cancel',
    // Events-scroller counter: "<side> +N km²", always a gain, never a loss — see
    // eventGainLabel(). factionNames is a DISPLAY table only; FACTIONS above stays the single
    // canonical source of faction ids, colours and names shared with the other three tools
    // (CONVENTIONS §10), and nothing here ever feeds a style lookup.
    factionNames: { ukraine: 'Ukraine', russia: 'Russia', contested: 'Contested', neutral: 'Neutral' },
    gainLabel: function (side, v) { return side + ' +' + v + ' km²'; },
    unnamed: 'Unnamed',
    basemapMaps: 'Maps', basemapSatellite: 'Satellite', basemapTerrain: 'Terrain',
    layerOsm: 'OSM', layerYandexMap: 'Yandex (RU)', layerGoogleRoads: 'Google Roads',
    layerSatelliteEsri: 'Satellite (Esri)', layerYandexHybrid: 'Yandex Hybrid', layerGoogleHybrid: 'Google Hybrid',
    layerOpenTopo: 'OpenTopoMap',
  },
  ru: {
    measure: '📐 Измерить',
    measureTitle: 'Нарисуйте полигон, чтобы измерить площадь и периметр',
    langToggleTitle: 'Switch to English',
    loading: 'Загрузка…',
    refreshed: function (time) { return 'Обновлено ' + time; },
    loadingTerritory: 'Загрузка территории…',
    territoryLoaded: 'Территория загружена',
    controlAreasUnavailable: function (msg) { return 'Зоны контроля недоступны (' + msg + ')'; },
    countAreas: function (n) { return n + ' ' + pluralRu(n, 'зона', 'зоны', 'зон'); },
    statsHeader: 'Процент контролируемых территорий',
    ruPct: function (p) { return p + '% РФ'; },
    rowAreas: function (ru, ua) { return 'Россия: ' + ru + ' км² · Украина: ' + ua + ' км²'; },
    timelineHeader: 'События',
    timelineToggleTitle: 'Показать или скрыть ленту последних изменений',
    historyDateTitle: 'Выберите дату, чтобы вернуть линию фронта к состоянию на конец этого дня',
    live: '● Сейчас',
    liveTitle: 'Вернуться к текущей линии фронта',
    showingAsOf: function (d) { return 'Линия фронта на конец ' + d; },
    measureArea: function (a) { return 'Площадь: <span class="val">' + a + ' км²</span>'; },
    measurePerimeter: function (p) { return 'Периметр: <span class="val">' + p + ' км</span>'; },
    measureHint: 'Клик — добавить точку · Enter — завершить · Esc — отмена',
    factionNames: { ukraine: 'Украина', russia: 'Россия', contested: 'Спорная', neutral: 'Нейтральная' },
    gainLabel: function (side, v) { return side + ' +' + v + ' км²'; },
    unnamed: 'Без названия',
    basemapMaps: 'Карты', basemapSatellite: 'Спутник', basemapTerrain: 'Рельеф',
    layerOsm: 'OSM', layerYandexMap: 'Яндекс (рус)', layerGoogleRoads: 'Google Дороги',
    layerSatelliteEsri: 'Satellite (Esri)', layerYandexHybrid: 'Яндекс Гибрид', layerGoogleHybrid: 'Google Гибрид',
    layerOpenTopo: 'OpenTopoMap',
  },
};
function t(key) { return STRINGS[currentLang][key]; }

// Fixed, closed set of Ukraine's administrative regions — safe to hardcode rather than
// plumb through the data pipeline. Keyed on the exact Ukrainian spelling territory_stats.json
// already publishes (sourced from oblasts.geojson); unrecognised names fall back to it as-is.
var OBLAST_NAMES = {
  'Вінницька область':          { en: 'Vinnytsia Oblast',      ru: 'Винницкая область' },
  'Волинська область':          { en: 'Volyn Oblast',          ru: 'Волынская область' },
  'Дніпропетровська область':   { en: 'Dnipropetrovsk Oblast', ru: 'Днепропетровская область' },
  'Донецька область':           { en: 'Donetsk Oblast',        ru: 'Донецкая область' },
  'Житомирська область':        { en: 'Zhytomyr Oblast',       ru: 'Житомирская область' },
  'Закарпатська область':       { en: 'Zakarpattia Oblast',    ru: 'Закарпатская область' },
  'Запорізька область':         { en: 'Zaporizhzhia Oblast',   ru: 'Запорожская область' },
  'Івано-Франківська область':  { en: 'Ivano-Frankivsk Oblast', ru: 'Ивано-Франковская область' },
  'Київська область':           { en: 'Kyiv Oblast',           ru: 'Киевская область' },
  'Кіровоградська область':     { en: 'Kirovohrad Oblast',     ru: 'Кировоградская область' },
  'Луганська область':          { en: 'Luhansk Oblast',        ru: 'Луганская область' },
  'Львівська область':          { en: 'Lviv Oblast',           ru: 'Львовская область' },
  'Миколаївська область':       { en: 'Mykolaiv Oblast',       ru: 'Николаевская область' },
  'Одеська область':            { en: 'Odesa Oblast',          ru: 'Одесская область' },
  'Полтавська область':         { en: 'Poltava Oblast',        ru: 'Полтавская область' },
  'Рівненська область':         { en: 'Rivne Oblast',          ru: 'Ровненская область' },
  'Сумська область':            { en: 'Sumy Oblast',           ru: 'Сумская область' },
  'Тернопільська область':      { en: 'Ternopil Oblast',       ru: 'Тернопольская область' },
  'Харківська область':         { en: 'Kharkiv Oblast',        ru: 'Харьковская область' },
  'Херсонська область':         { en: 'Kherson Oblast',        ru: 'Херсонская область' },
  'Хмельницька область':        { en: 'Khmelnytskyi Oblast',   ru: 'Хмельницкая область' },
  'Черкаська область':          { en: 'Cherkasy Oblast',       ru: 'Черкасская область' },
  'Чернівецька область':        { en: 'Chernivtsi Oblast',     ru: 'Черновицкая область' },
  'Чернігівська область':       { en: 'Chernihiv Oblast',      ru: 'Черниговская область' },
  'Автономна Республіка Крим':  { en: 'Crimea',                ru: 'Республика Крым' },
  'Севастополь':                { en: 'Sevastopol',            ru: 'Севастополь' },
};
function localizedOblastName(uaName) {
  var entry = OBLAST_NAMES[uaName];
  return entry ? entry[currentLang] : uaName;
}

// Russia's claimed administrative border within Ukraine — but only the segments that run
// between the 5 claimed regions (Crimea, 2014; Donetsk, Luhansk, Zaporizhzhia, Kherson
// oblasts, 2022) and other, non-claimed Ukrainian oblasts, independent of actual
// front-line control. Segments that instead fall on Ukraine's real national perimeter —
// the actual Russia/Belarus international border, or coastline — are deliberately
// omitted: that's not a claim boundary, it's just Russia's/the sea's own edge, and
// drawing a "claimed border" on top of it reads as if the claim extends past it.
// Hand-editable in code, not through a UI: each entry below is one open polyline of
// [lat, lng] pairs (NOT a closed ring — render as polylines, not polygons).
// Source: local oblasts.geojson (never published) — the 5 regions' polygons unioned
// (shapely unary_union) and simplified (100m tolerance, UTM 37N), then that union's
// boundary has the boundary of ALL Ukrainian oblasts unioned together (Ukraine's true
// national outline) subtracted from it, leaving only the inter-oblast segments.
// To adjust, edit the coordinates directly or regenerate via regenerate_claimed_border.py
// from an updated oblasts.geojson.
// Rebuilt 2026-08-08 from OSM admin_level=4 (download_oblasts.py). The array this replaced
// was 377 points over 1060 km — one vertex every 1.9 km — and ran a mean of 774 m, and up
// to 6.8 km, off the true oblast boundary, so it visibly cut corners across the boundary
// lines the basemap itself draws. That was the source data, not this line: oblasts.geojson
// was pre-generalised (Luhansk 263 points against OSM's 24,019). Now 1022 points at a mean
// of 15 m, max 99 m. If it ever looks wrong again, measure oblasts.geojson's vertex spacing

// Basemaps grouped into Карты (map) / Спутник (satellite) / Рельеф (topomap) — mirrors
// editor.html's basemap switcher. Yandex tiles use elliptical Mercator (EPSG:3395);
// everything else is ordinary spherical Web Mercator (EPSG:3857) — see selectBasemap().
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> — settlement boundaries also derived from OSM (ODbL)',
  maxZoom: 18, crsKey: '3857',
});
var yandexRu = L.tileLayer(
  'https://core-renderer-tiles.maps.yandex.net/tiles?l=map&x={x}&y={y}&z={z}&scale=1&lang=ru_RU',
  { attribution: '&copy; Яндекс', maxZoom: 18, crsKey: '3395' }
);
var googleRoads = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
  attribution: '&copy; Google', maxZoom: 20, subdomains: ['0','1','2','3'], crsKey: '3857',
});
var satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Tiles &copy; Esri — boundaries derived from OpenStreetMap (ODbL)', maxZoom: 18, crsKey: '3857' }
);
var yandexHybrid = L.tileLayer(
  'https://core-sat.maps.yandex.net/tiles?l=sat,skl&x={x}&y={y}&z={z}&scale=1&lang=ru_RU',
  { attribution: '&copy; Яндекс', maxZoom: 18, crsKey: '3395' }
);
var googleHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
  attribution: '&copy; Google', maxZoom: 20, subdomains: ['0','1','2','3'], crsKey: '3857',
});
var openTopo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)',
  maxZoom: 17, subdomains: ['a','b','c'], crsKey: '3857',
});

var map = L.map('map', { layers: [osm] }).setView([48.5, 33.5], 7);
map.attributionControl.setPrefix(false); // drop the "Leaflet" branding link/flag, keep tile attributions
L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);

// Hand-rolled grouped basemap switcher — Leaflet's built-in L.control.layers has no concept
// of groups. One radio group across all three sections; only ever one tile layer active.
var activeBasemap = osm;
function selectBasemap(layer) {
  if (layer === activeBasemap) return;
  map.removeLayer(activeBasemap);
  activeBasemap = layer;
  layer.addTo(map);
  var want = layer.options.crsKey === '3395' ? L.CRS.EPSG3395 : L.CRS.EPSG3857;
  if (map.options.crs !== want) {
    var c = map.getCenter(), z = map.getZoom();
    map.options.crs = want;
    map._resetView(c, z);
  }
}
function buildBasemapControl(groups) {
  var Ctl = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      var box = L.DomUtil.create('div', 'basemap-switcher');
      groups.forEach(function (g) {
        var h = L.DomUtil.create('div', 'bs-group-title', box);
        h.textContent = g.title;
        g.items.forEach(function (it) {
          var row = L.DomUtil.create('label', 'bs-row', box);
          var radio = L.DomUtil.create('input', '', row);
          radio.type = 'radio'; radio.name = 'basemap';
          radio.checked = it.layer === activeBasemap;
          row.appendChild(document.createTextNode(' ' + it.label));
          L.DomEvent.on(radio, 'click', function () { selectBasemap(it.layer); });
        });
      });
      L.DomEvent.disableClickPropagation(box);
      L.DomEvent.disableScrollPropagation(box);
      return box;
    }
  });
  var instance = new Ctl();
  map.addControl(instance);
  return instance;
}
// Group headers and item labels come from t() (§ i18n above) so the switcher can be rebuilt
// in the other language without losing which basemap is currently selected (selectBasemap
// tracks that separately via activeBasemap, read fresh on every rebuild).
function basemapGroups() {
  return [
    { title: t('basemapMaps'), items: [
      { label: t('layerOsm'),         layer: osm },
      { label: t('layerYandexMap'),   layer: yandexRu },
      { label: t('layerGoogleRoads'), layer: googleRoads },
    ] },
    { title: t('basemapSatellite'), items: [
      { label: t('layerSatelliteEsri'), layer: satellite },
      { label: t('layerYandexHybrid'),  layer: yandexHybrid },
      { label: t('layerGoogleHybrid'),  layer: googleHybrid },
    ] },
    { title: t('basemapTerrain'), items: [
      { label: t('layerOpenTopo'), layer: openTopo },
    ] },
  ];
}
var basemapControlInstance = null;
function rebuildBasemapControl() {
  if (basemapControlInstance) map.removeControl(basemapControlInstance);
  basemapControlInstance = buildBasemapControl(basemapGroups());
}
rebuildBasemapControl();

// ── Fills: one pane, one canvas, opaque shapes ────────────────────────────────
// Mirrors bootstrap.html and editor.html. Per-feature fillOpacity composites wherever
// two polygons overlap and produces a colour nobody painted — a settlement zone sitting
// on a region of the SAME faction lights up as a different shade. Drawing every fill
// fully opaque into a single canvas and putting the translucency on the pane means
// whatever is drawn last simply replaces what is under it. Both groups must share
// `fillsR`: separate renderers mean separate canvases and the blending is back.
map.createPane('fills');
map.getPane('fills').style.zIndex = 400;
map.getPane('fills').style.opacity = '0.42';
var fillsR = L.canvas({ pane: 'fills', padding: 0.3 });

var regionLayer = null;   // control_regions.geojson — the only territory file now (CONVENTIONS §10)

// Claimed-border overlay — a fixed reference line, not territory data, so it sits above the
// 'fills' pane (z-index 400) and is always visible regardless of basemap or fill opacity.
// CLAIMED_BORDER holds open polylines (front-line-only segments — see the comment above the
// array), not closed rings, so this draws as L.polyline, not L.polygon.
map.createPane('claimedBorder');
map.getPane('claimedBorder').style.zIndex = 450;
// A dark casing drawn first holds contrast on light and dark basemaps alike — a plain line
// washed out badly over satellite imagery. Solid, semi-transparent, no dash — matches the
// front-line style convention used elsewhere (thick translucent band, not a dashed outline).
// Opacities are 30% lower than their original 0.35/0.65 — the line read as too heavy-handed
// against the fills it sits above.
L.polyline(CLAIMED_BORDER, {
  pane: 'claimedBorder', interactive: false,
  color: '#3a0a1f', weight: 6, opacity: 0.245, lineJoin: 'round', lineCap: 'round',
}).addTo(map);
L.polyline(CLAIMED_BORDER, {
  pane: 'claimedBorder', interactive: false,
  color: '#c2255c', weight: 4, opacity: 0.455, lineJoin: 'round', lineCap: 'round',
}).addTo(map);

// The 1px stroke is the fill colour, never a contrasting outline: it exists only to close
// the antialiased hairline between abutting polygons (CONVENTIONS §10).
// Contested = a real two-colour diagonal stripe pattern, not a third flat colour. Drawn as
// a CanvasPattern object so it can go through the same shared 'fills' canvas as every other
// faction — L.Canvas assigns options.fillColor/color straight to ctx.fillStyle/strokeStyle,
// which accept a CanvasPattern just as well as a string. A separate SVG-pattern renderer
// would mean a separate canvas and bring the cross-polygon blending problem back
// (CONVENTIONS §10), so this stays on-canvas instead.
// Recent-change variant per faction — highlights a feature changed within the last 24h (see
// isRecentChange() and paintStyle()/isRecentRegion() below). The rule for both factions is
// the same: recent is the SATURATED version of the faction colour, held ground is the washed
// one. It is deliberately not "lighter than base" — the whole 'fills' pane renders at 0.42
// opacity (see createPane('fills') above), so every fill is already blended most of the way
// towards the basemap, and a lighter tint disappears into it entirely.
// Two earlier pairs both failed here, for opposite reasons:
//   - Ukraine #60a5fa / Russia #ef4444 (original): nearly the same channel spread as the base
//     colours, so compositing at 0.42 landed within a few points of the base's own saturation
//     — invisible against ground the faction already held.
//   - Ukraine #1e3a8a / Russia #991b1b (2026-08-07 fix attempt): darker, but *narrower*
//     channel spread than the base colours (navy and maroon are lower-chroma than #3b82f6 /
//     #f87171 to begin with). Compositing toward a light basemap scales chroma down by the
//     pane's alpha regardless of how dark the source is, so a low-spread dark colour crushes
//     to near-grey faster than a high-spread light one does. Measured against white: base

  return '<div class="zone-popup">'
    + '<h3>' + (p.name || "Unnamed area") + '</h3>'
    + factionBadge(p.faction)

// ── Loading ───────────────────────────────────────────────────────────────────
// The two files are independent documents fetched independently: one missing or
// malformed must not blank the other. Counts are tracked separately so the status bar
// can say which half is live.
var counts = { regions: null };
var errors = { regions: null };

function report() {
  var msgEl = document.getElementById('status-msg');
  var errMsgs = [];
  if (errors.regions) errMsgs.push(t('controlAreasUnavailable')(errors.regions));

  var stillLoading = counts.regions === null;
  if (errMsgs.length) {
    msgEl.textContent = errMsgs.join(' · ');
    msgEl.className = 'err';
  } else {
    msgEl.textContent = stillLoading ? t('loadingTerritory') : t('territoryLoaded');
    msgEl.className = '';
  }

  var r = counts.regions;
  document.getElementById('count').textContent = (r === null ? '' : t('countAreas')(r));
  document.getElementById('last-updated').textContent =
    stillLoading ? t('loading') : t('refreshed')(new Date().toLocaleTimeString());
}

// Settlement zones come from independent per-settlement raster grids (one WMS tile +

// thin gap, or a hole in the fill wholly surrounded by one faction's colour. A fixed-pixel
// stroke can't close this correctly at every zoom level (the same real-world gap gets wider

var rawRegionsFC = { type: 'FeatureCollection', features: [] };
var selectedDate = null;   // non-null while viewing a past date instead of the live fetch

// not via setStyle. Returning them from the style function alone silently drops both and
// every fill lands in the default overlay pane at full opacity.

// every geometry nudge (meld, cut, redraw, repair) reads as if the whole oblast just changed
// hands when really a sliver got trimmed off one corner. Only a genuine oblast-tool faction
// reassignment (or brand-new oblast-tool add) is newsworthy enough to light up the whole
// shape, so an oblast keys off faction_set_at — stamped ONLY by oblastClick() in
// editor.html, never by geometry-only edits — not last_updated, which every touch-up bumps.
// Every other region (zone_type:"custom" — settlement-scale claims, including former

// ── Contested-zone edge borders ─────────────────────────────────────────────────────
// The contested hatch (CONVENTIONS §10 exempts this pattern from the no-coloured-borders
// rule, same as it already exempts the pattern itself) reads as a muddy mid-tone at low
// zoom, especially against a busy basemap — easy to miss that ground is contested at all
// rather than assuming it belongs to whichever colour happens to dominate the hatch at that
// pixel. This traces each contested polygon's outline and casings the stretches that
// actually border Ukraine- or Russia-held ground in a darker shade of that faction's colour,
// so the pocket reads at a glance before the hatch itself is legible.
//
// Classification is by proximity sampling, not exact polygon intersection: turf has no
// "clip a line by a polygon" primitive, and exact computation over control_regions.geojson's
// full feature set (several MB, oblast-sized polygons included) would be far too slow to
// redo on every load and every historical date change. Instead each contested outline is
// chunked into short segments; each segment's midpoint is classified by the nearest
// same-tile neighbour's outline, bbox-prefiltered so only genuinely nearby features are
// ever tested. Cosmetic only, like closeGaps() below — never written back to any data file.
// PARKED 2026-08-06 — flip to true to bring the casings back. Everything below stays wired
// up and callable; only the draw is switched off, so reviving this is a one-word change and
// not an archaeology exercise. Turned off because the proximity-sampling classification was
// still getting two things visibly wrong after the merge-chord fix, and the operator judged
// further chasing not worth it for what is only a zoomed-out legibility aid:
//
//   1. Casings appearing along a boundary between two SOLID fills, nowhere near visible
//      hatching. Unverified lead for whoever picks this up: fills are drawn into one shared
//      canvas in array order, last-drawn winning (see §3.5 "Rendering model"), so a contested
//      region sitting under a later solid region is invisible as a fill — but its outline is
//      still in the data, and this runs off the data in its own pane above 'fills'. If that
//      is it, the fix is to classify against what is actually VISIBLE, not against every
//      contested feature in the file.

map.createPane('contestedEdge');
map.getPane('contestedEdge').style.zIndex = 420;   // above 'fills' (400), below 'claimedBorder' (450)
var contestedEdgeGroup = L.layerGroup().addTo(map);

var CONTESTED_EDGE_COLORS = { ukraine: '#1d4ed8', russia: '#b91c1c' };  // darker than FACTIONS' own blue/red, not as dark as navy/maroon

    // faction, that shared stretch must stay uncoloured — it is not a claim boundary. A pure
    // "only ukraine/russia are candidates" filter already keeps contested-contested pairs
    // from being compared directly, but is not airtight on its own: a segment right at a
    // shared edge can still sit within CONTESTED_EDGE_MATCH_M of some OTHER real faction

    // it bordered that faction directly. Tracking every other nearby contested pocket's
    // outline here and requiring it be the closest thing before colouring anything closes
    // that gap explicitly, rather than relying on the general case happening to work out.
    contested.forEach(function (c2) {
      if (c2 === c || !bboxesNear(cbbox, bboxOf(c2))) return;

        else if (dR <= CONTESTED_EDGE_MATCH_M && dR < dU && dR < dC) cls = 'russia';
        if (!cls) return;

          cls: cls, lineIdx: lineIdx, chunkIdx: chunkIdx,
          latlngs: coords.map(function (xy) { return [xy[1], xy[0]]; }),

function renderRegionsLayer(data, highlightIds) {
  if (regionLayer) map.removeLayer(regionLayer);
  regionLayer = L.geoJSON(closeGaps(data), {
    pane: 'fills', renderer: fillsR,
    style: function (f) { return paintStyle(f.properties || {}, highlightIds); },
  }).addTo(map);
  buildContestedEdges(data.features || []);
}

function loadRegions() {
  fetch('control_regions.geojson?_=' + Date.now())
    .then(function (r) {
      if (r.status === 404) { var e = new Error('missing'); e.missing = true; throw e; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      rawRegionsFC = data;
      if (!selectedDate) renderRegionsLayer(data, null);
      counts.regions = (data.features || []).length;
      errors.regions = null;
      report();
    })
    .catch(function (err) {
      // A repo with no wholesale territory yet is a valid state, not a failure.
      if (err.missing) { counts.regions = 0; errors.regions = null; }
      else errors.regions = err.message;
      report();
    });
}

      .filter(function (o) { return o.total_km2 > 0 && (100 * o.russia_km2 / o.total_km2) >= 1; })
      .sort(function (a, b) { return b.russia_km2 - a.russia_km2; })
      .map(function (o) {
        return '<div class="stats-row">'
          + '<div class="stats-row-top"><span>' + localizedOblastName(o.name) + '</span><span>'
          + t('ruPct')((100 * o.russia_km2 / o.total_km2).toFixed(0)) + '</span></div>'
          + '<div class="stats-row-areas">' + t('rowAreas')(fmtArea(o.russia_km2), fmtArea(o.ukraine_km2)) + '</div>'
          + '</div>';
      }).join('');
    box.innerHTML = '<div class="stats-head" id="stats-toggle">' + t('statsHeader') + ' ▾</div>'
      + '<div class="stats-list">' + rows + '</div>';
  }
  document.getElementById('stats-toggle').addEventListener('click', function () {
    statsMinimized = !statsMinimized;
    renderStats();
  });
}

function loadStats() {
  fetch('territory_stats.json?_=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) { lastStats = data; renderStats(); })
    .catch(function () { lastStats = null; document.getElementById('stats-widget').style.display = 'none'; });
}

// ── Frontline history: events scroller + calendar revert ───────────────────────────
// Fetches editor.html's rolling-window frontline_history.json (see computeFrontlineHistory()
// there). Reconstructing a past date works backward from the LIVE state: for each feature,
// only the earliest history entry after the target date matters — its base_geometry/
// prev_faction already is that feature's exact state as of the end of the target date,
// since that entry's bucket opened with exactly that state. No need to chain through every
// day in between.
var lastHistory = null;

// Entries dated before this are edits made while wiring this feature up, not real
// frontline changes — hidden from the public timeline. Real entries resume 2026-08-07.
var HISTORY_VISIBLE_FROM = '2026-08-07';

function loadHistory() {
  fetch('frontline_history.json?_=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var entries = (data.entries || []).filter(function (e) { return e.date >= HISTORY_VISIBLE_FROM; });
      lastHistory = Object.assign({}, data, { entries: entries });
      document.getElementById('history-panel').classList.remove('hidden');
      var dates = entries.map(function (e) { return e.date; });
      var dateInput = document.getElementById('history-date');
      if (dates.length) {
        dateInput.min = dates[0];
        dateInput.max = todayIso();
      }
      renderEventsScroller();
    })
    .catch(function () {
      lastHistory = null;
      document.getElementById('history-panel').classList.add('hidden');
    });
}

function todayIso() {
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function featureBoundsFromGeom(geom) {
  if (!geom) return null;
  try { return L.geoJSON(geom).getBounds(); } catch (e) { return null; }
}

// ── Events scroller: one card per real event, not per changed feature ──────────────
// The published history is per-FEATURE, and one real event routinely spans several features.
// Two normal editor workflows produce that: redrawing a pocket as a fresh polygon instead of
// editing the existing one (three overlapping claims on one village → three "add" records),
// and replacing yesterday's shape by deleting it and drawing today's over the same ground
// (a "remove" plus an "add" on the same date). editor.html's diffState() cannot collapse
// either — it diffs state by feature id and has no way to know two ids are the same story.
// So the collapse happens here, at display time only: same date, overlapping ground, one
// card. The underlying entries are left untouched, because reconstructStateAsOf()'s replay
// needs every per-feature record to rebuild a past date correctly.
function changeGeom(c) { return c.geometry || c.base_geometry || null; }

// Same ground means each shape is mostly the other one — not merely that they touch, and not
// merely that one sits inside the other. Both failure modes are live here: neighbouring
// pockets along one front share a border, and a settlement-scale claim almost always sits
// wholly inside an oblast wash that was edited the same day. Measuring the overlap against
// the SMALLER shape would swallow every such claim into its oblast's card (measured: it ate
// four of nine cards on 2026-08-04, including a 6.9 km² settlement gain), so the denominator
// is the LARGER shape. A redraw of the same pocket clears that easily — the shapes are near
// duplicates; a 7 km² claim inside a 30,000 km² oblast cannot come close, which is the point.
var EVENT_MERGE_OVERLAP = 0.35;
function sameGround(a, b) {
  if (typeof turf === 'undefined') return false;
  var ga = changeGeom(a), gb = changeGeom(b);
  if (!ga || !gb) return false;
  try {
    var fa = { type: 'Feature', properties: {}, geometry: ga };
    var fb = { type: 'Feature', properties: {}, geometry: gb };
    var inter = turf.intersect(fa, fb);
    if (!inter) return false;
    var larger = Math.max(turf.area(fa), turf.area(fb));
    return larger > 0 && (turf.area(inter) / larger) >= EVENT_MERGE_OVERLAP;
  } catch (e) { return false; }
}

// Grouping keeps the transitive closure as it goes: a change that matches two existing groups
// merges them, so A–C and B–C never end up as two cards just because B was seen before C.
function groupSameDayChanges(changes) {
  var groups = [];
  changes.forEach(function (c) {
    var hits = [];
    groups.forEach(function (g, i) {
      if (g.some(function (m) { return sameGround(m, c); })) hits.push(i);
    });
    if (!hits.length) { groups.push([c]); return; }
    var target = groups[hits[0]];
    target.push(c);
    for (var k = hits.length - 1; k >= 1; k--) {
      target.push.apply(target, groups[hits[k]]);
      groups.splice(hits[k], 1);
    }
  });
  return groups;
}

// A day's `changes` array is append-ordered by mergeChange() in editor.html — a feature joins
// it the first time that day's save catches it — so later in the array means later in the day.
// The card should therefore speak for the last surviving shape: the newest name (the operator
// renaming a redraw is exactly how they correct a typo in the first attempt) and the faction
// still on the ground. A group that is nothing but removals has no survivor, so its last
// removal speaks for it.
function eventRepresentative(group) {
  for (var i = group.length - 1; i >= 0; i--) if (group[i].action !== 'remove') return group[i];
  return group[group.length - 1];
}

function unionAreaKm2(geoms) {
  if (typeof turf === 'undefined' || !geoms.length) return 0;
  try {
    var acc = { type: 'Feature', properties: {}, geometry: geoms[0] };
    for (var i = 1; i < geoms.length; i++) {
      var u = turf.union(acc, { type: 'Feature', properties: {}, geometry: geoms[i] });
      if (u) acc = u;
    }
    return turf.area(acc) / 1e6;
  } catch (e) { return 0; }
}

// Summing the members' area_delta_km2 would double-count exactly the overlap that put them in
// one group: three stacked ~1.5 km² redraws of one village would report ~4.6 km² taken. The
// group's real delta is the area its shapes cover now minus the area they covered before, so
// both sides are unioned first. An update whose geometry never moved carries no
// base_geometry — its current shape *is* its previous shape and belongs on both sides, or the
// unchanged ground reads as newly gained.
function groupDelta(group) {
  if (group.length === 1) return group[0].area_delta_km2 || 0;
  if (typeof turf === 'undefined') {
    return group.reduce(function (n, c) { return n + (c.area_delta_km2 || 0); }, 0);
  }
  var after = [], before = [];
  group.forEach(function (c) {
    if (c.geometry) after.push(c.geometry);
    if (c.base_geometry) before.push(c.base_geometry);
    else if (c.action === 'update' && c.geometry) before.push(c.geometry);
  });
  return unionAreaKm2(after) - unionAreaKm2(before);
}

// Entries written before `pattern` joined the published projection don't carry one. The live
// feature still does, and a hatch is not something the operator flips back and forth, so
// reading it off current state covers the tail of the retention window well enough.
function livePatternOf(id) {
  var fs = rawRegionsFC.features || [];
  for (var i = 0; i < fs.length; i++) {
    if (fs[i].properties && fs[i].properties.id === id) return fs[i].properties.pattern || null;
  }
  return null;
}

var OPPOSING_FACTION = { ukraine: 'russia', russia: 'ukraine' };
// Which side the card credits, and whether it gets a counter at all.
// A contested pocket or an attack hatch is a claim about where fighting is happening, not a
// measured transfer of ground — putting km² on one implies a precision the shape does not
// have, and "contested gained 3 km²" names no side anyway. Those cards carry no counter.
// Everything else is a solid faction fill, where the counter always reads as a gain for
// somebody: a positive delta is ground that faction took, and with two sides on the map a
// negative delta is the same ground going to the other one. Returns null for "no counter".
function eventGainLabel(rep, delta) {
  var fid = rep.faction || rep.prev_faction;
  var pattern = rep.pattern || livePatternOf(rep.id);
  if (pattern === 'attack' || fid === 'contested' || fid === 'neutral' || !fid) return null;
  var v = Math.abs(delta);
  if (v < 0.05) return null;   // a rename, or a nudge a rounded "+0.0 km²" would misreport
  var side = delta >= 0 ? fid : OPPOSING_FACTION[fid];
  if (!side) return null;
  return { side: side, text: t('gainLabel')(t('factionNames')[side] || side, v.toFixed(1)) };
}

// ── The panel's own collapse state ──────────────────────────────────────────────
// Starts collapsed: the bar takes a strip of map height from every viewer, and most arrive
// for the current front rather than the log of how it got there. Not persisted, matching the
// stats widget's statsMinimized — one session's choice, not a stored preference.
var historyCollapsed = true;
function renderHistoryToggle() {
  var btn = document.getElementById('history-toggle');
  btn.textContent = t('timelineHeader') + ' ' + (historyCollapsed ? '▸' : '▾');
  btn.title = t('timelineToggleTitle');
}
document.getElementById('history-toggle').addEventListener('click', function () {
  historyCollapsed = !historyCollapsed;
  document.getElementById('history-panel').classList.toggle('collapsed', historyCollapsed);
  renderHistoryToggle();
  // The scroller cannot measure its own scrollWidth while display:none, so the "newest card
  // in view" scroll that renderEventsScroller() does is a no-op on a collapsed panel. Redo
  // it on the way open, or the first thing an expanding viewer sees is the oldest card.
  if (!historyCollapsed) {
    var box = document.getElementById('events-scroller');
    box.scrollLeft = box.scrollWidth;
  }
});

// ── The citation behind a change ────────────────────────────────────────────────
// Written in editor.html as `info_source` on the region and snapshotted onto the change
// record; see that file's INFORMATION SOURCE section for the shape and why it is not the
// long-standing `source` field. Two forms render today — a masked link (label + href) and
// plain text. A third, an unmasked link, needs nothing here: it arrives as a url whose label
// is the url, which is already the masked-link branch.
function safeHttpUrl(u) {
  var s = (u || '').trim();
  return /^https?:\/\//i.test(s) ? s : null;   // never emit an href for any other scheme
}
function sourceHtml(src) {
  if (!src) return '';
  var label = (src.label || '').trim();
  var url = safeHttpUrl(src.url);
  if (url) {
    // noopener/noreferrer because the href is operator-supplied and points off-site, and
    // target=_blank without it hands the opened page a handle back to this one.
    return '<div class="ec-source"><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">'
         + esc(label || url) + '</a></div>';
  }
  return label ? '<div class="ec-source"><span class="plain">' + esc(label) + '</span></div>' : '';
}

// A card is a group of per-feature records, so the citation comes off the representative and
// falls back to any member carrying one — a redraw logged as three polygons only ever has
// the source typed onto it once.
function eventSourceOf(group) {
  var rep = eventRepresentative(group);
  if (rep.info_source) return rep.info_source;
  for (var i = group.length - 1; i >= 0; i--) if (group[i].info_source) return group[i].info_source;
  return null;
}

function groupBounds(group) {
  var b = null;
  group.forEach(function (c) {
    var gb = featureBoundsFromGeom(changeGeom(c));
    if (!gb || !gb.isValid()) return;
    b = b ? b.extend(gb) : gb;
  });
  return b;
}

function renderEventsScroller() {
  var box = document.getElementById('events-scroller');
  if (!lastHistory || !lastHistory.entries.length) { box.innerHTML = ''; return; }
  // Flattened across all days, oldest first — the most recent event is the last card.
  var cards = [];
  lastHistory.entries.forEach(function (e) {
    groupSameDayChanges(e.changes).forEach(function (g) { cards.push({ date: e.date, group: g }); });
  });
  box.innerHTML = '';
  cards.forEach(function (item) {
    var rep = eventRepresentative(item.group);
    var gain = eventGainLabel(rep, groupDelta(item.group));
    // rep.name is the canonical (Russian) name; rep.name_en is optional and only shown in
    // English mode, falling back to rep.name when the operator never set one.
    var displayName = (currentLang === 'en' && rep.name_en) ? rep.name_en : rep.name;
    var el = document.createElement('div');
    el.className = 'event-card';
    el.innerHTML = '<div class="ec-date">' + item.date + '</div>'
      + '<div class="ec-name">' + esc(displayName || t('unnamed')) + '</div>'
      + (gain
          ? '<div class="ec-delta" style="color:' + ((FACTIONS[gain.side] || {}).color || '#888')
            + '">' + esc(gain.text) + '</div>'
          : '')
      + sourceHtml(eventSourceOf(item.group));
    el.addEventListener('click', function (ev) {
      // The whole card zooms the map, but the source link inside it has to open the source —
      // without this the click bubbles and does both at once.
      if (ev.target.closest && ev.target.closest('.ec-source a')) return;
      var b = groupBounds(item.group);
      if (b && b.isValid()) map.fitBounds(b, { maxZoom: 12 });
    });
    box.appendChild(el);
  });
  box.scrollLeft = box.scrollWidth; // most recent (last) card starts in view
}
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

// Reconstructs state as of the end of targetDate (YYYY-MM-DD) from the live raw fetch plus
// every history entry dated after it. Returns { regions, changedIds }.
// Entries inside the retention window may still carry kind:"zone" from before CONVENTIONS
// §10 folded settlement zones into regions — kind is read only as a display fallback below,
// never to route a feature into a separate bucket. The id is what ties an entry to a live
// feature (preserved across the migration — see migrateZonesToRegions() in editor.html), so
// resolving by id alone into one bucket replays correctly on both sides of that migration.
function reconstructStateAsOf(targetDate) {
  var working = new Map();   // id -> feature
  (rawRegionsFC.features || []).forEach(function (f) {
    if (f.properties && f.properties.id) working.set(f.properties.id, f);
  });

  var earliest = new Map();  // id -> change, from the earliest date > targetDate
  (lastHistory.entries || [])
    .filter(function (e) { return e.date > targetDate; })
    .slice()
    .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })
    .forEach(function (e) {
      e.changes.forEach(function (c) { if (!earliest.has(c.id)) earliest.set(c.id, c); });
    });

  earliest.forEach(function (c, id) {
    if (c.action === 'add') {
      working.delete(id);   // did not exist as of targetDate
      return;
    }
    if (c.action === 'remove') {
      var props = { id: id, name: c.prev_name || c.name, faction: c.prev_faction };
      working.set(id, { type: 'Feature', properties: props, geometry: c.base_geometry });
      return;
    }
    // update
    var cur = working.get(id);
    if (!cur) return;
    var props2 = Object.assign({}, cur.properties);
    if (c.prev_faction) props2.faction = c.prev_faction;
    if (c.prev_name) props2.name = c.prev_name;
    working.set(id, { type: 'Feature', properties: props2, geometry: c.base_geometry || cur.geometry });
  });

  var regions = [];
  working.forEach(function (f) { regions.push(f); });

  // Same rule as isRecentRegion() for the live view: an oblast only belongs in the
  // "changed" set if the change was a genuine oblast-tool faction event (add or
  // reassignment), not a geometry-only touch-up — otherwise browsing history would light
  // up a whole oblast for every meld/cut/redraw that happened to land on target date + 1.
  // Everything else (settlement-scale, oblast or not) is always newsworthy at its own size.
  var changedIds = new Set();
  earliest.forEach(function (c, id) {
    var cur = working.get(id);
    var isOblast = cur && cur.properties && cur.properties.zone_type === 'oblast';
    var isFactionEvent = c.action === 'add' || (c.fields || []).indexOf('faction') !== -1;
    if (!isOblast || isFactionEvent) changedIds.add(id);
  });

  return {
    regions: { type: 'FeatureCollection', features: regions },
    changedIds: changedIds,
  };
}

function showHistoricalDate(targetDate) {
  if (!lastHistory) return;
  selectedDate = targetDate;
  var result = reconstructStateAsOf(targetDate);
  renderRegionsLayer(result.regions, result.changedIds);
  document.getElementById('history-live').classList.remove('active');
  document.getElementById('history-live').disabled = false;
  document.getElementById('status-msg').textContent = t('showingAsOf')(targetDate);
  document.getElementById('status-msg').className = '';
}
function showLive() {
  selectedDate = null;
  document.getElementById('history-date').value = '';
  document.getElementById('history-live').classList.add('active');
  renderRegionsLayer(rawRegionsFC, null);
  report();
}

document.getElementById('history-date').addEventListener('change', function (e) {
  if (e.target.value) showHistoricalDate(e.target.value);
});
document.getElementById('history-live').addEventListener('click', showLive);

function refresh() { loadRegions(); loadStats(); loadHistory(); }

// ── Measure tool: draw a polygon, report area (km²) and perimeter (km) ─────────────
// A public-viewer aid, not territory data — its own pane with a dashed outline, so it
// isn't subject to the opaque-shared-canvas rule (CONVENTIONS §10), which only governs
// tools that draw territory.
map.createPane('measure');
map.getPane('measure').style.zIndex = 650;

var measureActive = false;
var measurePoints = [];   // [lat, lng] vertices, in click order
var measureShape  = null; // L.Polygon (>=3 points) or L.Polyline preview
var measureDots   = [];   // small vertex markers

// Same spherical geodesic ring-area formula as editor.html's ringAreaM2().
function ringAreaM2(coords) {   // coords: [[lng,lat], ...]
  var R = 6378137, total = 0, len = coords.length;
  if (len < 3) return 0;
  var rad = Math.PI / 180;
  for (var i = 0; i < len; i++) {
    var p1 = coords[i], p2 = coords[(i + 1) % len];
    total += (p2[0] - p1[0]) * rad * (2 + Math.sin(p1[1] * rad) + Math.sin(p2[1] * rad));
  }
  return Math.abs(total * R * R / 2);
}
function haversineM(a, b) {   // a, b: [lat, lng]
  var R = 6378137, rad = Math.PI / 180;
  var dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  var s = Math.sin(dLat / 2) * Math.sin(dLat / 2)
        + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(s));
}

function measureRedraw() {
  if (measureShape) { map.removeLayer(measureShape); measureShape = null; }
  measureDots.forEach(function (d) { map.removeLayer(d); });
  measureDots = [];

  measurePoints.forEach(function (pt) {
    measureDots.push(L.circleMarker(pt, {
      pane: 'measure', radius: 3, color: '#fff', weight: 1, fillColor: '#22c55e', fillOpacity: 1,
    }).addTo(map));
  });

  if (measurePoints.length > 1) {
    var opts = {
      pane: 'measure', color: '#22c55e', weight: 2, dashArray: '6,5',
      fillColor: '#22c55e', fillOpacity: measurePoints.length > 2 ? 0.12 : 0,
    };
    measureShape = measurePoints.length > 2
      ? L.polygon(measurePoints, opts).addTo(map)
      : L.polyline(measurePoints, opts).addTo(map);
  }
  updateMeasureReadout();
}

function updateMeasureReadout() {
  var box = document.getElementById('measure-readout');
  if (!measurePoints.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';

  var perimM = 0;
  for (var i = 0; i < measurePoints.length - 1; i++) perimM += haversineM(measurePoints[i], measurePoints[i + 1]);
  var areaKm2 = 0;
  if (measurePoints.length > 2) {
    perimM += haversineM(measurePoints[measurePoints.length - 1], measurePoints[0]); // closing edge
    var ring = measurePoints.map(function (p) { return [p[1], p[0]]; }); // ringAreaM2 wants [lng,lat]
    areaKm2 = ringAreaM2(ring) / 1e6;
  }
  box.innerHTML = (measurePoints.length > 2
      ? t('measureArea')(areaKm2.toFixed(2)) + '<br>' : '')
    + t('measurePerimeter')((perimM / 1000).toFixed(2))
    + (measureActive ? '<div class="hint">' + t('measureHint') + '</div>' : '');
}

function setMeasureActive(on) {
  measureActive = on;
  document.getElementById('tool-measure').classList.toggle('active', on);
  document.getElementById('map').classList.toggle('measuring', on);
  if (on) { measurePoints = []; measureRedraw(); }
  else { updateMeasureReadout(); }
}
document.getElementById('tool-measure').addEventListener('click', function () {
  setMeasureActive(!measureActive);
});
map.on('click', function (e) {
  if (!measureActive) return;
  measurePoints.push([e.latlng.lat, e.latlng.lng]);
  measureRedraw();
});
document.addEventListener('keydown', function (e) {
  if (!measureActive) return;
  if (e.key === 'Escape') { measurePoints = []; measureRedraw(); setMeasureActive(false); }
  else if (e.key === 'Enter') { setMeasureActive(false); }
});

// ── Language toggle ─────────────────────────────────────────────────────────────────
// Re-renders every bit of UI chrome from t(); anything driven by live data (report(),
// renderStats(), renderEventsScroller()) is safe to call any time since it reads current
// state rather than caching text. The basemap switcher is rebuilt from scratch since its
// labels are baked in at construction time by buildBasemapControl().
function renderStaticChrome() {
  // app-title is a fixed brand name — "CONFLICT MAP" stays in English in both languages,
  // unlike everything else here, so it deliberately isn't driven by t().
  var measureBtn = document.getElementById('tool-measure');
  measureBtn.textContent = t('measure');
  measureBtn.title = t('measureTitle');
  var langBtn = document.getElementById('tool-lang');
  langBtn.textContent = currentLang === 'en' ? 'RU' : 'EN';
  langBtn.title = t('langToggleTitle');
  document.getElementById('history-date').title = t('historyDateTitle');
  var liveBtn = document.getElementById('history-live');
  liveBtn.textContent = t('live');
  liveBtn.title = t('liveTitle');
  renderHistoryToggle();
}
function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(LANG_KEY, lang);
  renderStaticChrome();
  report();
  renderStats();
  renderEventsScroller();
  rebuildBasemapControl();
  updateMeasureReadout();
  if (selectedDate) {
    document.getElementById('status-msg').textContent = t('showingAsOf')(selectedDate);
  }
}
document.getElementById('tool-lang').addEventListener('click', function () {
  setLanguage(currentLang === 'en' ? 'ru' : 'en');
});
renderStaticChrome();
report();

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>

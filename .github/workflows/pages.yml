name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 600000 (10 min). Deployments on this repo have been taking close to
          # that just to leave "queued" — several genuine attempts got killed by the default
          # right as they were about to land. Doubling it trades a slower worst-case failure
          # for actually giving slow-but-working deployments room to finish.
          timeout: 1200000
